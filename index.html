<!DOCTYPE html>
<html>
<head>
    <title>Language Translator</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f6f9;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            background:white;
            padding:30px;
            width:600px;
            border-radius:15px;
            box-shadow:0 0 15px rgba(0,0,0,0.2);
        }

        h2{
            text-align:center;
            color:#333;
        }

        textarea{
            width:100%;
            padding:10px;
            border-radius:8px;
        }

        select{
            padding:8px;
            margin-top:10px;
        }

        button{
            margin-top:15px;
            width:100%;
            padding:12px;
            background:#007bff;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
        }

        button:hover{
            background:#0056b3;
        }

        .result{
            margin-top:20px;
            padding:15px;
            background:#f1f1f1;
            border-radius:8px;
        }
    </style>
</head>

<body>

<div class="container">

<h2>🌍 Language Translation Tool</h2>

<form method="POST">

<textarea name="text" rows="5"
placeholder="Enter text here"></textarea>

<br><br>

<label>Source Language</label>
<br>

<select name="source">
    <option value="en">English</option>
    <option value="hi">Hindi</option>
    <option value="te">Telugu</option>
</select>

<br><br>

<label>Target Language</label>
<br>

<select name="target">
    <option value="te">Telugu</option>
    <option value="hi">Hindi</option>
    <option value="en">English</option>
</select>

<br>

<button type="submit">
Translate
</button>

</form>

<div class="result">
<h3>Translated Text</h3>
<p>{{ translated_text }}</p>
</div>

</div>

</body>
</html>
